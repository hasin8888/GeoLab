<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — GeoLab</title>
<style>
  :root {
    --ink: #141815;
    --ink-soft: #4a4a42;
    --meta: #8a8578;
    --paper: #f7f5ef;
    --paper-raised: #fdfcf9;
    --line: #d9d4c4;
    --clay: #c9622a;
    --clay-soft: #f3e3d8;
    --err: #a3352b;
    --err-soft: #f5e2df;
    --success: #2f5d50;
    --success-soft: #e4ede9;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif;
    --mono: ui-monospace, 'SF Mono', Menlo, 'Cascadia Mono', Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  ::selection { background: var(--clay-soft); color: var(--clay); }
  :focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }

  .container {
    width: 100%;
    max-width: 420px;
  }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 40px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo {
    font-weight: 600;
    font-size: 1.8rem;
    letter-spacing: -.01em;
    text-decoration: none;
    color: var(--ink);
    margin-bottom: 16px;
    display: inline-block;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--ink);
  }

  .subtitle {
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin: 0;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-weight: 500;
    font-size: 0.9rem;
    margin-bottom: 8px;
    color: var(--ink);
  }

  input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 1rem;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    transition: border-color 0.2s;
  }

  input:focus {
    outline: none;
    border-color: var(--clay);
    background: var(--paper-raised);
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
  }

  input[type="checkbox"] {
    width: auto;
    cursor: pointer;
  }

  .btn {
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: 4px;
    font-weight: 500;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--ink);
    color: #fff;
  }

  .btn-primary:hover {
    background: #26324f;
  }

  .divider {
    text-align: center;
    margin: 24px 0;
    font-size: 0.85rem;
    color: var(--meta);
  }

  .divider::before,
  .divider::after {
    content: '';
    display: inline-block;
    width: 45%;
    height: 1px;
    background: var(--line);
    vertical-align: middle;
  }

  .divider::before {
    margin-right: 8px;
  }

  .divider::after {
    margin-left: 8px;
  }

  .link-group {
    text-align: center;
    font-size: 0.9rem;
  }

  .link-group a {
    color: var(--clay);
    text-decoration: none;
    font-weight: 500;
  }

  .link-group a:hover {
    text-decoration: underline;
  }

  .alerts {
    margin-bottom: 20px;
  }

  .alert {
    padding: 12px 14px;
    border-radius: 4px;
    font-size: 0.9rem;
    margin-bottom: 10px;
    border-left: 3px solid;
  }

  .alert-danger {
    background: var(--err-soft);
    color: var(--err);
    border-color: var(--err);
  }

  .alert-success {
    background: var(--success-soft);
    color: var(--success);
    border-color: var(--success);
  }

  .alert-info {
    background: #e3e8f2;
    color: #3a5a9b;
    border-color: #3a5a9b;
  }

  @media (max-width: 480px) {
    .card {
      padding: 30px 20px;
    }

    h1 {
      font-size: 1.3rem;
    }
  }
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <a href="/" class="logo">GeoLab</a>
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alerts">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label class="remember">
          <input type="checkbox" name="remember" id="remember">
          <span>Remember me for 30 days</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <div class="divider">or</div>

    <div class="link-group">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
    </div>
  </div>
</div>

</body>
</html>
