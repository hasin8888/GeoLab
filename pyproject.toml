[project]
name = "pythonproject"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "requests",
    "flask-sqlalchemy",
    "flask-login",
    "werkzeug",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
# Tests live in tests/. They are plain unittest classes, so pytest runs them
# as-is; new tests can use plain asserts and the `client` fixture (conftest.py).
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".venv", ".idea", "_backup", "_removed", ".etc_cache", "scenes", "static", "templates"]
addopts = "-q"
